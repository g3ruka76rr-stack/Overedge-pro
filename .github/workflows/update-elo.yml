name: Actualizar Elo/yElo

on:
  # Desactivado el cron automatico: TennisAbstract bloquea las peticiones que
  # vienen de los servidores de GitHub Actions (proteccion Cloudflare), asi
  # que programado siempre fallaria. El Elo/yElo se actualiza ahora subiendo
  # a mano los 4 JSON de /data (ver README.md).
  workflow_dispatch: {}   # boton manual "Run workflow" en la pestaña Actions, por si se quiere reintentar algun dia

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Descargar Elo/yElo
        run: node scripts/update_elo.js

      - name: Comitear si hay cambios
        run: |
          git config user.name "overedge-bot"
          git config user.email "overedge-bot@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "Sin cambios, nada que comitear."
          else
            git add data/
            git commit -m "Actualizar Elo/yElo ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
